<!doctype html>
<html lang="tr" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Temayı ve plan modunu boyamadan önce uygula (yanıp sönme olmasın).
			// /zen kendi temasını ve kendi tercihini kullanır; plan modu orada yok.
			var zen = /^\/zen(\/|$)/.test(location.pathname);
			var acik = zen ? 'zen-gunduz' : 'tezgah';
			var koyu = zen ? 'zen-gece' : 'gece-vardiyasi';
			try {
				var t = localStorage.getItem(zen ? 'zen-tema' : 'tema');
				if (t !== acik && t !== koyu)
					t = matchMedia('(prefers-color-scheme: dark)').matches ? koyu : acik;
				document.documentElement.dataset.theme = t;
				if (!zen && localStorage.getItem('plan') === '1')
					document.documentElement.dataset.plan = '';
			} catch (e) {
				document.documentElement.dataset.theme = acik;
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
